name: compute_kart
description: "ComputeKart - Cloud compute platform desktop client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # State Management & Routing
  get: ^4.6.6

  # HTTP Client
  dio: ^5.4.0

  # Local Storage
  get_storage: ^2.1.1

  # Charts
  fl_chart: ^1.2.0

  # Typography
  google_fonts: ^8.1.0

  # Desktop Window Management
  window_manager: ^0.5.1

  # File Picker (Buckets)
  file_picker: ^11.0.2

  # URL Launcher
  url_launcher: ^6.2.5

  # Icons
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^6.0.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - .env


flutter_launcher_icons:
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"

  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

  linux:
    generate: true
    image_path: "assets/icon/app_icon.png"